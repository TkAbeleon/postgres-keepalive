name: Keep n8n awake

on:
  schedule:
    # GitHub Actions cron runs in UTC.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Prevent two keepalive runs from overlapping.
concurrency:
  group: keep-n8n-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake and ping Hugging Face n8n
        shell: bash
        run: |
          set -euo pipefail

          URL="https://rtsikynyantsa-jerymotro-pipeline.hf.space/"

          echo "Pinging: $URL"

          # HF Spaces can take some time to wake up after being idle.
          # Retry several times and fail the job if the endpoint never
          # returns a successful HTTP response.
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 6 \
            --retry-delay 15 \
            --retry-all-errors \
            --header "User-Agent: github-actions-keepalive/1.0" \
            --output /tmp/n8n-response.txt \
            --write-out "HTTP status: %{http_code}\nTotal time: %{time_total}s\n" \
            "$URL"

          echo "n8n is reachable."
